[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfixer"
version = "0.1.0"
description = "Automatic Python syntax error detector and fixer CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "kimshincho2000", email = "kimshincho2000@users.noreply.github.com"}
]
keywords = ["syntax", "syntax-error", "linter", "fixer", "python", "cli", "autofix"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "autopep8>=2.0",
]

[project.urls]
Homepage = "https://github.com/kimshincho2000/pyfixer"
Repository = "https://github.com/kimshincho2000/pyfixer"
Issues = "https://github.com/kimshincho2000/pyfixer/issues"

[project.scripts]
pyfixer = "pyfixer.__main__:main"
pyfix = "pyfixer.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyfixer*"]
